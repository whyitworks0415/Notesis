<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src data: blob:; font-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <title>문서 보기</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <nav id="toolbar" aria-label="문서 탐색" hidden>
    <div class="controls">
      <button id="previous" aria-label="이전 페이지">‹</button>
      <label><input id="page-number" type="number" min="1" value="1" aria-label="페이지 번호"> <span id="page-count"></span></label>
      <button id="next" aria-label="다음 페이지">›</button>
    </div>
    <div class="controls">
      <button id="zoom-out" aria-label="축소">−</button>
      <output id="zoom-label">100%</output>
      <button id="zoom-in" aria-label="확대">+</button>
      <button id="fit">너비 맞춤</button>
    </div>
  </nav>
  <p id="status" role="status" aria-live="polite">문서의 서식과 배치를 불러오는 중…</p>
  <div id="formula-bar" hidden><strong id="cell-address">A1</strong><span id="cell-value">셀을 선택하면 전체 내용을 볼 수 있습니다.</span></div>
  <main id="viewport" tabindex="0" aria-label="문서 내용"><div id="surface"></div></main>
  <nav id="sheets" aria-label="시트 선택" hidden></nav>
  <script type="module" src="viewer.js"></script>
</body>
</html>
