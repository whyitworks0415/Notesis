# Builds the APK on GitHub's runners, because the tablet is the only machine
# around and it cannot build itself. Runs on a push to a work branch or on
# demand from the Actions tab, and leaves the APK in two places: a build
# artifact, and a release, which is the one a tablet browser can install from
# in a single tap.
name: APK

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:
    inputs:
      update:
        # automatic: the app tells everyone about it as it opens.
        # manual: it is installed only from About · Help, with nothing said.
        # A release can also be marked manual in its notes file, with the
        # line `<!-- update: manual -->`, which is how a push releases one.
        description: "How the app offers this release"
        type: choice
        options: ["automatic", "manual"]
        default: "automatic"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # SDK Tools (`tools`) was replaced by cmdline-tools and is no longer
          # installable. The action's default still asks sdkmanager for it.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        # gradle.properties pins org.gradle.java.home to a path on the author's
        # own Windows machine, which does not exist here. A system property on
        # the command line outranks the properties file, so the pin stays where
        # it is useful and this build uses the JDK that was just set up.
        run: ./gradlew assembleRelease -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --stacktrace

      - name: Unit tests
        # Reported, not gating: a failing JVM test shows up red here without
        # holding back the APK the tablet is waiting for.
        continue-on-error: true
        run: ./gradlew testReleaseUnitTest -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      - name: Name the build
        id: name
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CODE=$(grep -oP '^\s*versionCode = \K\d+' app/build.gradle.kts)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-$CODE" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "Notesis-$VERSION-$CODE.apk"

      - name: Mark a manual update
        if: ${{ github.event.inputs.update == 'manual' }}
        run: |
          NOTES="docs/releases/${{ steps.name.outputs.version }}.md"
          grep -qi 'update: *manual' "$NOTES" || printf '\n<!-- update: manual -->\n' >> "$NOTES"

      - uses: actions/upload-artifact@v4
        with:
          name: Notesis-${{ steps.name.outputs.version }}-${{ steps.name.outputs.code }}
          path: Notesis-*.apk
          if-no-files-found: error

      - name: Publish a release to install from
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          # The commit this APK was built from. Left out, a new tag lands on
          # the default branch, and every release run from a work branch was
          # tagged at main instead of at its own code.
          target_commitish: ${{ github.sha }}
          name: Notesis ${{ steps.name.outputs.version }} (${{ steps.name.outputs.code }})
          body_path: docs/releases/${{ steps.name.outputs.version }}.md
          files: Notesis-*.apk
          fail_on_unmatched_files: true
