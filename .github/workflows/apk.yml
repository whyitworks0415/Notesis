# This branch builds a separate application and publishes preview tags only.
# Do not merge its package or release routing into the standard application.
name: Notesis Lab APK

on:
  workflow_dispatch:
    inputs:
      update:
        # Lab releases are manual, pre-release, and excluded from the normal feed.
        # check: builds and runs the tests only - nothing is signed or
        # released - so a change can be tried without spending a version.
        description: "How the app offers this release (check: build and test only)"
        type: choice
        options: ["manual", "check"]
        default: "manual"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A token that may write releases to the releases-only repository, kept as
      # a repository secret. Without it the release is made here only, which
      # is enough while this repository is public; see docs/private-repo-releases.md.
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: signing builds its key-rotation lineage from the
          # old key, which is only there (see docs/signing.md).
          fetch-depth: 0

      - name: Verify isolated Lab package
        run: |
          grep -q 'applicationId = "com.notesis.lab"' app/build.gradle.kts
          grep -q 'lab-' .github/workflows/apk.yml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # SDK Tools (`tools`) was replaced by cmdline-tools and is no longer
          # installable. The action's default still asks sdkmanager for it.
          packages: "platform-tools ndk;28.2.13676358 cmake;3.22.1"
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Native correctness and host benchmark
        run: bash tools/performance-lab/check-native.sh

      - name: Build release APK
        # gradle.properties pins org.gradle.java.home to a path on the author's
        # own Windows machine, which does not exist here. A system property on
        # the command line outranks the properties file, so the pin stays where
        # it is useful and this build uses the JDK that was just set up.
        run: ./gradlew assembleRelease -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --stacktrace

      - name: Unit tests
        # Never sign or publish an update whose regression tests failed.
        run: ./gradlew testReleaseUnitTest -Pnotesis.hostNativeDir="$PWD/build/host-native" -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      # Check and manual builds also verify chrome under Robolectric before
      # signing. The manual APK must contain the UI that passed these tests.
      - name: Screenshots
        if: ${{ github.event.inputs.update == 'check' || github.event.inputs.update == 'manual' }}
        # Robolectric and Roborazzi are built for Java 21; the runner has one beside the 17 the app builds with.
        run: ./gradlew testDebugUnitTest --tests 'com.notesis.LibraryScreenshotTest' --tests 'com.notesis.CanvasImagePreviewsTest' --tests 'com.notesis.DarkChromeScreenshotTest' --tests 'com.notesis.MaterialMotionUiTest' --tests 'com.notesis.NativeBoundsTreeTest' --tests 'com.notesis.LabPerformanceTest' -Pnotesis.hostNativeDir="$PWD/build/host-native" -Dorg.gradle.java.home="${JAVA_HOME_21_X64:-$JAVA_HOME}" --no-daemon

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.update == 'check' }}
        continue-on-error: true
        with:
          name: screenshots-${{ github.sha }}
          path: app/build/outputs/roborazzi/
          if-no-files-found: warn
          retention-days: 3

      - name: Name the build
        if: ${{ github.event.inputs.update != 'check' }}
        id: name
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CODE=$(grep -oP '^\s*versionCode = \K\d+' app/build.gradle.kts)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=lab-v$VERSION-$CODE-preview" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id unsigned.apk | grep -Fx 'com.notesis.lab'
          cp build/host-native/benchmark.txt Spatial-host-benchmark.txt

      - name: Sign the APK with the release key
        if: ${{ github.event.inputs.update != 'check' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTESIS_KEYSTORE_BASE64 }}
          # The same text in further pieces, for when a long paste gets cut short.
          KEYSTORE_BASE64_2: ${{ secrets.NOTESIS_KEYSTORE_BASE64_2 }}
          KEYSTORE_BASE64_3: ${{ secrets.NOTESIS_KEYSTORE_BASE64_3 }}
          KEYSTORE_BASE64_4: ${{ secrets.NOTESIS_KEYSTORE_BASE64_4 }}
          KEYSTORE_BASE64_5: ${{ secrets.NOTESIS_KEYSTORE_BASE64_5 }}
          KEYSTORE_PASSWORD: ${{ secrets.NOTESIS_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::NOTESIS_KEYSTORE_BASE64 and NOTESIS_KEYSTORE_PASSWORD are not set as repository secrets, so the APK cannot be signed. See docs/signing.md."
            exit 1
          fi
          # yes is cut off when sdkmanager has read its answers: not a failure.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null || true
          BT="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$BT/apksigner" || { echo "::error::build-tools 34.0.0 did not install"; exit 1; }
          KEYS="$RUNNER_TEMP/keys"
          mkdir -p "$KEYS"
          # A pasted secret can carry spaces, line breaks or quotes; none belongs to it.
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          export KEYSTORE_PASSWORD
          printf '%s' "$KEYSTORE_BASE64${KEYSTORE_BASE64_2:-}${KEYSTORE_BASE64_3:-}${KEYSTORE_BASE64_4:-}${KEYSTORE_BASE64_5:-}" | tr -d ' \t\r\n"' > "$KEYS/release.b64"
          echo "NOTESIS_KEYSTORE_BASE64 holds $(wc -c < "$KEYS/release.b64") characters."
          base64 -d "$KEYS/release.b64" > "$KEYS/release.jks" || {
            echo "::error::NOTESIS_KEYSTORE_BASE64 is not valid base64 - most likely cut short or changed when pasted. Paste the whole keystore.base64.txt again. See docs/signing.md."
            exit 1; }
          keytool -list -keystore "$KEYS/release.jks" -storepass:env KEYSTORE_PASSWORD -alias notesis >/dev/null 2>&1 || {
            echo "::error::The keystore did not open with NOTESIS_KEYSTORE_PASSWORD under the alias notesis."
            exit 1; }
          NEW=(--ks "$KEYS/release.jks" --ks-key-alias notesis --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD)
          # Devices that have the app signed with the first key accept an update
          # signed with the new one only with proof that the first key handed
          # over to it: a lineage. It is made here from the first key, which is
          # public (it was committed) and so protects nothing, and the new one.
          git show 598b9d7:keystore/release.jks > "$KEYS/first.jks"
          FIRST=(--ks "$KEYS/first.jks" --ks-key-alias notesis --ks-pass pass:notesis-release)
          "$BT/apksigner" rotate --out "$KEYS/lineage" --old-signer "${FIRST[@]}" --new-signer "${NEW[@]}"
          "$BT/zipalign" -p -f 4 unsigned.apk "$KEYS/aligned.apk"
          "$BT/apksigner" sign "${FIRST[@]}" --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
            --next-signer "${NEW[@]}" --rotation-min-sdk-version 28 --lineage "$KEYS/lineage" \
            --out "Notesis-Lab-${{ steps.name.outputs.version }}-${{ steps.name.outputs.code }}.apk" "$KEYS/aligned.apk"
          # It must be the key that was meant, and verify.
          "$BT/apksigner" verify --verbose --print-certs Notesis-Lab-*.apk | tee "$KEYS/verify.txt"
          WANT=$(tr -d ' \n:' < signing/CERT_SHA256 | tr 'A-F' 'a-f')
          grep -iq "certificate SHA-256 digest: $WANT" "$KEYS/verify.txt" || {
            echo "::error::The APK is signed by a different key than signing/CERT_SHA256 names."; exit 1; }
          rm -rf "$KEYS" unsigned.apk

      - name: Mark a manual update
        if: ${{ github.event.inputs.update == 'manual' }}
        run: |
          NOTES="docs/releases/${{ steps.name.outputs.version }}.md"
          grep -qi 'update: *manual' "$NOTES" || printf '\n<!-- update: manual -->\n' >> "$NOTES"

      # A copy kept with the run for a few days. The release below carries the
      # APK for good, so a full artifact store must not stop the release.
      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.update != 'check' }}
        continue-on-error: true
        with:
          name: Notesis-Lab-${{ steps.name.outputs.version }}-${{ steps.name.outputs.code }}
          path: Notesis-Lab-*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publish a release to install from
        if: ${{ github.event.inputs.update != 'check' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          # The commit this APK was built from. Left out, a new tag lands on
          # the default branch, and every release run from a work branch was
          # tagged at main instead of at its own code.
          target_commitish: ${{ github.sha }}
          name: Notesis Lab ${{ steps.name.outputs.version }} (${{ steps.name.outputs.code }})
          prerelease: true
          make_latest: false
          body_path: docs/releases/${{ steps.name.outputs.version }}.md
          files: |
            Notesis-Lab-*.apk
            Spatial-host-benchmark.txt
          fail_on_unmatched_files: true

      # The app looks for updates in a repository of its own that holds nothing
      # but releases, so the source can be private: a private repository's
      # releases and downloads are closed to an app that is not signed in.
      - name: Publish the same release where the app looks for updates
        if: ${{ env.RELEASES_TOKEN != '' && github.event.inputs.update != 'check' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: whyitworks0415/Notesis-releases
          token: ${{ env.RELEASES_TOKEN }}
          tag_name: ${{ steps.name.outputs.tag }}
          name: Notesis Lab ${{ steps.name.outputs.version }} (${{ steps.name.outputs.code }})
          prerelease: true
          make_latest: false
          body_path: docs/releases/${{ steps.name.outputs.version }}.md
          files: |
            Notesis-Lab-*.apk
            Spatial-host-benchmark.txt
          fail_on_unmatched_files: true
